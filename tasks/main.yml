---
- name: Install node_exporter for Unix hosts
  when: ansible_os_family != "Windows"
  block:
    - name: Check for node_exporter group
      become: true
      check_mode: true
      ansible.builtin.group:
        name: "{{ node_exporter_group }}"
        state: present
      register: node_exporter_group_check_result

    - name: Set node_exporter_group_exists fact
      ansible.builtin.set_fact:
        node_exporter_group_exists: "{{ not node_exporter_group_check_result.changed \
          | bool }}"

    - name: Create group for node_exporter if it does not exist
      become: true
      ansible.builtin.group:
        name: "{{ node_exporter_group }}"
        system: true
        state: present
      when:
        - node_exporter_create_user
        - not node_exporter_group_exists

    - name: Check for node_exporter user
      become: true
      check_mode: true
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        state: present
      register: node_exporter_user_check_result

    - name: Set node_exporter_user_exists fact
      ansible.builtin.set_fact:
        node_exporter_user_exists: "{{ not node_exporter_user_check_result.changed \
          | bool }}"

    - name: Create user for node_exporter if it does not exist
      become: true
      ansible.builtin.user:
        name: "{{ node_exporter_user }}"
        groups: "{{ node_exporter_group }}"
        createhome: false
        home: "/dev/null"
        shell: "/usr/sbin/nologin"
        system: true
        state: present
      when:
        - node_exporter_create_user
        - not node_exporter_user_exists

    - name: Include tasks to install binary on Unix hosts
      ansible.builtin.include_tasks: "unix/install-binary.yml"
      when: node_exporter_install_from_binary

    - name: Include OS-specific tasks to install via package manager
      ansible.builtin.include_tasks: "{{ ansible_os_family | lower }}\
        /install-package-{{ ansible_pkg_mgr }}.yml"
      when: not node_exporter_install_from_binary

    - name: Include OS-specific tasks to configure service
      ansible.builtin.include_tasks: "{{ ansible_os_family | lower }}\
        /configure-service-{{ ansible_service_mgr }}.yml"

- name: Install node_exporter for Windows hosts
  ansible.builtin.include_tasks: "windows/install.yml"
  when: ansible_os_family == "Windows"
